# =============================================================================
# nginx.conf - Configuration Nginx pour servir l'app Angular MySchool
# =============================================================================
# Cette conf est copiee dans l'image Docker a l'emplacement
#   /etc/nginx/conf.d/default.conf
# Elle configure :
#   - Le port d'ecoute (80)
#   - La racine des fichiers statiques
#   - La compression gzip pour reduire la taille des reponses
#   - Le cache long sur les assets versionnes
#   - Le routage SPA (toutes les routes renvoient vers index.html)
# =============================================================================

server {
    # Port HTTP standard
    listen       80;
    server_name  localhost;

    # Dossier ou se trouvent les fichiers statiques Angular (copies dans le Dockerfile)
    root         /usr/share/nginx/html;
    index        index.html;

    # -------------------------------------------------------------------------
    # Compression gzip : reduit la taille des fichiers servis au navigateur
    # -------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # -------------------------------------------------------------------------
    # Cache long pour les assets versionnes (js, css, images, fonts)
    # Angular ajoute un hash dans les noms de fichiers (output-hashing=all),
    # donc on peut les cacher 1 an sans risque de servir une version obsolete.
    # -------------------------------------------------------------------------
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Routage SPA Angular
    # -------------------------------------------------------------------------
    # Angular gere le routing cote client. Si on demande /users/42, Nginx doit
    # renvoyer index.html (et non une 404), puis Angular prendra le relais.
    # try_files teste chaque option dans l'ordre :
    #   1. $uri         : fichier exact (ex: /assets/logo.png)
    #   2. $uri/        : dossier exact
    #   3. /index.html  : fallback SPA
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------------------
    # Pages d'erreur par defaut
    # -------------------------------------------------------------------------
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}

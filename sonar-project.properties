# =============================================================================
# sonar-project.properties - Configuration SonarQube Frontend MySchool
# =============================================================================
# Fichier lu par sonar-scanner pour analyser l'app Angular (TypeScript)
# Utilise depuis le Jenkinsfile via : sonar-scanner (sans arguments)
# =============================================================================

# --- Identification du projet sur le serveur SonarQube -----------------------
# La cle doit correspondre EXACTEMENT au projet cree sur http://localhost:9000
sonar.projectKey=myschool-front
sonar.projectName=MySchool Frontend
sonar.projectVersion=1.0

# --- URL du serveur SonarQube (local) ----------------------------------------
sonar.host.url=http://sonarqube:9000

# --- Encodage des sources ----------------------------------------------------
sonar.sourceEncoding=UTF-8

# --- Sources a analyser ------------------------------------------------------
# On analyse uniquement le dossier src/ (code applicatif Angular)
sonar.sources=src

# --- Tests unitaires ---------------------------------------------------------
# Les tests Angular sont dans src/ (a cote du code) avec le suffixe .spec.ts
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts

# --- Exclusions globales -----------------------------------------------------
# On exclut tout ce qui n'est pas du code source metier a analyser
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/*.spec.ts,\
  **/environments/**,\
  **/main.ts,\
  **/polyfills.ts

# --- Exclusions de couverture ------------------------------------------------
# Les fichiers de tests eux-memes ne doivent pas compter dans la coverage
sonar.coverage.exclusions=\
  **/*.spec.ts,\
  **/environments/**,\
  **/main.ts,\
  **/polyfills.ts,\
  **/*.module.ts

# --- Rapport de couverture JavaScript/TypeScript -----------------------------
# lcov.info est genere par les tests (vitest / karma) dans coverage/
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

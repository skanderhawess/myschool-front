<header class="topbar">
    <div class="search-container">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" class="search-icon" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" placeholder="Search coming soon..." class="search-input"
               [disabled]="true" style="opacity: 0.6; cursor: not-allowed;">
    </div>

    <div class="actions">
        <div class="notifications">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
        </div>

        <div class="user-profile">
            <div class="avatar">
                {{ userInitial }}
            </div>
            <div class="user-info">
                <span class="name">{{ userName }}</span>
                <span class="level">MySchool Admin</span>
            </div>
        </div>
    </div>
</header>

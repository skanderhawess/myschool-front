<div class="stat-card" [class.active]="data.active">
    <div class="icon-wrapper" [ngSwitch]="data.icon">
        <!-- Coins -->
        <svg *ngSwitchCase="'coins'" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="8" cy="8" r="7"></circle>
            <polyline points="20 8 20 16 12 16"></polyline>
            <circle cx="16" cy="16" r="7"></circle>
        </svg>
        <!-- Card -->
        <svg *ngSwitchCase="'card'" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="5" width="20" height="14" rx="2"></rect>
            <line x1="2" y1="10" x2="22" y2="10"></line>
        </svg>
        <!-- Chart -->
        <svg *ngSwitchCase="'chart'" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"></line>
            <line x1="12" y1="20" x2="12" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
    </div>
    <div class="info">
        <span class="title">{{ data.title }}</span>
        <span class="amount">{{ data.amount }}</span>
    </div>
</div>
